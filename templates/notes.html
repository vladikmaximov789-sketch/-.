{% extends 'base.html' %}

{% block content %}
    <h1>Ваши заметки</h1>

    <!-- Форма добавления -->
    <form method="post">
        <textarea name="content" rows="3" cols="40" placeholder="Новая заметка..." required></textarea><br><br>
        <button type="submit">Добавить</button>
    </form>

    <hr>

    {% if notes %}
        <ul>
            {% for note in notes %}
                <li>{{ note.content }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Пока нет заметок. Добавьте первую!</p>
    {% endif %}
{% endblock %}
